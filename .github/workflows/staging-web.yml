name: Staging web deploy (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: staging-web-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          BASE_HREF="/${REPO}/"
          DEFINES=(--dart-define=APP_ENV=staging)
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            DEFINES+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
            DEFINES+=(--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY")
          else
            echo "::warning::SUPABASE secrets missing — web build allows auth bypass only."
          fi
          flutter build web --release --base-href "$BASE_HREF" "${DEFINES[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
